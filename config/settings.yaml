app:
  env: dev
  log_level: INFO

kalshi:
  base_url: https://api.elections.kalshi.com
  ws_url: wss://api.elections.kalshi.com/trade-api/ws/v2
  ticker_regex: '^KXBTC.*'

coinbase:
  ws_url: wss://ws-feed.exchange.coinbase.com
  rest_candles_url: https://api.exchange.coinbase.com/products/BTC-USD/candles
  product_id: BTC-USD
  history_candles: 300
  backfill_max_hours: 48
  gap_repair_interval_minutes: 15
  gap_repair_lookback_hours: 3

pricer:
  vol_window_minutes: 60
  vol_floor_annualized: 0.20
  vol_ceiling_annualized: 3.00
  min_horizon_seconds: 5
  # vol_mode: "fixed" (Phase 1 baseline) | "horizon_scaled" (Phase 2 Commit B)
  # | "blend" | "ewma" (added in B2). Default stays "fixed" for A/B parity.
  vol_mode: fixed
  vol_window_floor_min: 60
  vol_window_cap_min: 1440
  # Default bracket width for KXBTC-*-B<low> markets (15-min). Active series
  # are mostly $250; some use $500. Phase 2 should infer per-series via Kalshi REST.
  bracket_width_usd_default: 250.0

strategy:
  edge_threshold: 0.04
  min_horizon_seconds: 30
  # Bumped from 900 (15m) to 86400 (24h) so daily KXBTCD-* markets are eligible.
  # BS-from-realized-vol degrades at long horizons; revisit once we measure calibration.
  max_horizon_seconds: 86400
  max_spread_cents: 10
  min_top_book_depth: 5

sizing:
  bankroll_cents: 50000
  kelly_fraction: 0.25
  max_contracts_per_trade: 5

risk:
  max_position_per_market: 25
  max_gross_exposure: 50
  max_daily_loss_cents: 5000
  max_drawdown_cents: 3000
  max_data_age_seconds: 10
  max_orders_per_minute: 60

execution:
  fee_bps: 50
  slippage_bps: 20
  min_order_interval_ms: 500

storage:
  db_path: data/bot.db

measurement:
  calibration_bins: 10
  calibration_window: 500
