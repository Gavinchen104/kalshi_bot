app:
  env: dev
  log_level: INFO

kalshi:
  base_url: https://api.elections.kalshi.com
  ws_url: wss://api.elections.kalshi.com/trade-api/ws/v2
  ticker_regex: '^KXBTC.*'

coinbase:
  ws_url: wss://ws-feed.exchange.coinbase.com
  rest_candles_url: https://api.exchange.coinbase.com/products/BTC-USD/candles
  product_id: BTC-USD
  history_candles: 300
  backfill_max_hours: 48
  gap_repair_interval_minutes: 15
  gap_repair_lookback_hours: 3

pricer:
  vol_window_minutes: 60
  vol_floor_annualized: 0.20
  vol_ceiling_annualized: 3.00
  min_horizon_seconds: 5
  # vol_mode: "fixed" (Phase 1 baseline) | "horizon_scaled" | "blend" | "ewma".
  # Default stays "fixed" for A/B parity; backtest --vol-mode lets you compare.
  vol_mode: fixed
  vol_window_floor_min: 60
  vol_window_cap_min: 1440
  vol_long_floor_days: 0       # >0 enables trailing N-day vol floor (W1.4)
  ewma_half_life_min: null     # null = horizon-tuned (~horizon/4, clamped)
  # Default bracket width for KXBTC-*-B<low> markets (15-min). Active series
  # are mostly $250; some use $500. Phase 2 should infer per-series via Kalshi REST.
  bracket_width_usd_default: 250.0

strategy:
  edge_threshold: 0.04
  min_horizon_seconds: 30
  # Bumped from 900 (15m) to 86400 (24h) so daily KXBTCD-* markets are eligible.
  # BS-from-realized-vol degrades at long horizons; revisit once we measure calibration.
  max_horizon_seconds: 86400
  max_spread_cents: 10
  min_top_book_depth: 5
  # Phase 3 / B1: generated by `python -m src.backtest.engine --mini-gate-b1`.
  # The file is local-only (ignored under data/models/) because it is fitted
  # from the operator's collected market history.
  calibration_model_path: data/models/b1_isotonic.json
  # Phase 3 / A1: near-strike guard band (USD). Measured 2026-05-20 from
  # `python -m src.measurement.basis` = jitter_p95 ($52.87) × 2. Suppresses
  # signals where |spot − strike| is within this band (cross-feed basis risk).
  near_strike_guard_usd: 105.75

sizing:
  bankroll_cents: 50000
  kelly_fraction: 0.25
  max_contracts_per_trade: 5

risk:
  max_position_per_market: 25
  max_gross_exposure: 50
  max_tail_short_exposure: 10
  tail_low_prob: 0.10
  tail_high_prob: 0.90
  vol_regime_zscore: 3.0
  vol_regime_min_samples: 30
  max_daily_loss_cents: 5000
  max_drawdown_cents: 3000
  max_data_age_seconds: 10
  max_orders_per_minute: 60

execution:
  fee_bps: 50
  slippage_bps: 20
  min_order_interval_ms: 500
  top_book_fill_fraction: 1.0

storage:
  db_path: data/bot.db

measurement:
  calibration_bins: 10
  calibration_window: 500

monitoring:
  alert_cooldown_seconds: 300
  stalled_feed_seconds: 60
  data_quality_window_hours: 48
  data_quality_min_coverage: 0.95
  calibration_drift_brier_threshold: 0.20
  calibration_drift_min_samples: 100
